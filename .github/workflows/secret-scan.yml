name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (Stellar secret key gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Runs the pinned gitleaks image directly (no license key needed).
      # --redact keeps matched secrets out of logs; git mode also scans commit messages.
      - name: Scan commits in range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          range=""
          if [[ -n "${BASE_SHA}" && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            range="--log-opts=${BASE_SHA}..${HEAD_SHA}"
          fi
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo \
            --config=/repo/.gitleaks.toml --redact --verbose --exit-code 1 ${range}
