name: Terraform Validate
on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform-validate.yml"]
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: validate (no backend)
        run: |
          for d in infra/terraform/modules/* infra/terraform/envs/*; do
            (cd "$d" && terraform init -backend=false -input=false && terraform validate)
          done
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: tflint --chdir infra/terraform --recursive
      - name: checkov
        run: pipx run checkov -d infra/terraform --framework terraform --quiet
